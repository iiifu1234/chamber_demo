<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="c2_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e2c3a"/>
      <stop offset="100%" stop-color="#0f1922"/>
    </linearGradient>
    <linearGradient id="c2_win" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0097a7" stop-opacity="0.6"/>
    </linearGradient>
  </defs>
  <!-- Chamber Body -->
  <rect x="15" y="10" width="90" height="98" rx="8" fill="url(#c2_grad)" stroke="#00bcd4" stroke-width="2.5"/>
  <!-- Top Panel -->
  <rect x="25" y="18" width="70" height="14" rx="3" fill="#0d1117" stroke="#384358" stroke-width="1"/>
  <circle cx="34" cy="25" r="3" fill="#00bcd4"/>
  <circle cx="44" cy="25" r="3" fill="#4caf50"/>
  <circle cx="54" cy="25" r="3" fill="#e91e63"/>
  <rect x="64" y="21" width="24" height="8" rx="2" fill="#1f293d"/>
  <!-- Observation Window (Cold Frost) -->
  <rect x="28" y="40" width="64" height="52" rx="4" fill="url(#c2_win)" stroke="#00bcd4" stroke-width="1.5"/>
  <!-- Cryo Frost lines -->
  <line x1="28" y1="56" x2="92" y2="56" stroke="#00bcd4" stroke-width="1" stroke-dasharray="3,2" opacity="0.6"/>
  <line x1="28" y1="72" x2="92" y2="72" stroke="#00bcd4" stroke-width="1" stroke-dasharray="3,2" opacity="0.6"/>
  <!-- Chamber Door Handle -->
  <rect x="85" y="58" width="5" height="18" rx="2" fill="#adb5bd"/>
  <!-- Feet -->
  <rect x="22" y="108" width="12" height="6" rx="2" fill="#343a40"/>
  <rect x="86" y="108" width="12" height="6" rx="2" fill="#343a40"/>
</svg>
